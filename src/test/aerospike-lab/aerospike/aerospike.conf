# Single-node Aerospike Enterprise. The image's evaluation feature key
# (/etc/aerospike/features.conf) enables XDR and change notification.
service {
	feature-key-file /etc/aerospike/features.conf
	cluster-name lab
	proto-fd-max 15000
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}
	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}
	fabric {
		address local
		port 3001
	}
}

namespace test {
	replication-factor 1
	nsup-period 10
	storage-engine memory {
		data-size 1G
	}
}

# Change notification: ship changed records of namespace test to the
# outbound connector. XDR ships the latest version of a record, so rapid
# updates coalesce. Expirations and evictions ship only with
# ship-nsup-deletes.
xdr {
	dc kafkaDC {
		connector true
		node-address-port outbound 8080
		namespace test {
		}
	}
}
