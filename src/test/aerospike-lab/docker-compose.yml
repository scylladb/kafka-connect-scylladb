# Aerospike CDC lab:
# Aerospike (XDR) -> outbound connector -> Kafka -> Connect + ScyllaDB sink -> ScyllaDB
name: aerospike-lab

services:
  aerospike:
    image: ${AEROSPIKE_IMAGE}
    command: ["--config-file", "/opt/lab/aerospike.conf"]
    ulimits:
      nofile: { soft: 15000, hard: 15000 }
    volumes:
      - ./aerospike/aerospike.conf:/opt/lab/aerospike.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v status | grep -q ok"]
      interval: 5s
      retries: 30

  outbound:
    image: ${OUTBOUND_IMAGE}
    volumes:
      - ./outbound/${FORMAT}.yml:/etc/aerospike-kafka-outbound/aerospike-kafka-outbound.yml:ro
    depends_on:
      kafka: { condition: service_healthy }

  kafka:
    image: confluentinc/cp-kafka:${CP_VERSION}
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: aerospike-lab-cluster0
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 5s
      retries: 30

  # For the kafka-avro format, started with --profile avro. No outbound
  # config uses it yet.
  schema-registry:
    image: confluentinc/cp-schema-registry:${CP_VERSION}
    profiles: ["avro"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  connect:
    image: confluentinc/cp-kafka-connect:${CP_VERSION}
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: aerospike-lab
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/opt/lab/plugins
    volumes:
      - ./.plugin:/opt/lab/plugins:ro
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:8083/connectors"]
      interval: 5s
      retries: 60

  scylla:
    image: ${SCYLLA_IMAGE}
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1"]
    volumes:
      - ./scylla/schema.cql:/opt/lab/schema.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 5s
      retries: 60

  # One-shot client: docker compose run --rm tools aql ...
  tools:
    image: ${AEROSPIKE_TOOLS_IMAGE}
    profiles: ["tools"]
    entrypoint: []
