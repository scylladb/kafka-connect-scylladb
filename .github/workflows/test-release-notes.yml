name: Test release automation

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [master]
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix .github
      - run: node --test .github/tests/*.test.cjs
