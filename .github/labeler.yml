# One union pattern must match every reported filename, including mixed support PRs.
omit-from-release-notes:
  - changed-files:
      - all-globs-to-all-files:
          - '{.github/**,src/test/**,images/*.{png,jpg,svg},documentation/*.md,README.md,.gitignore,renovate.json,scripts/release/test_guard.py,scripts/release/test_workflow.py,scripts/release/test_github_release.py}'
